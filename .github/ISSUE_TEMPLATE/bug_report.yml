name: Bug report
description: Report a reproducible defect in MP Frontend
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve MP Frontend. Do not include credentials, private design files, or personal data.
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@mpfrontend/ftg-cli 0.1.0-dev.18"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Node.js, pnpm, and Nx versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide exact commands and a minimal public repository or fixture when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Redact tokens, cookies, private URLs, and personal information.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no secrets or private design material.
          required: true
        - label: This is not a security vulnerability.
          required: true
